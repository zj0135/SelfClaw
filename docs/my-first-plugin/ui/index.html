<!doctype html>
<html lang="zh">

<head>
	<meta charset="utf-8" />
	<title>我的第一个插件</title>
	<style>
		/* 面板是独立源的 iframe，拿不到宿主的设计系统，样式必须自带。
		   应用当前只有浅色主题，所以这里不做深色适配。 */
		:root {
			--ink: #171a1f;
			--muted: #6b7280;
			--line: #e5e7eb;
			--accent: #3b5bfd;
			--ok: #0f9d63;
			--warn: #c2740a;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 14px;
			color: var(--ink);
			font: 13px/1.6 'Segoe UI', system-ui, sans-serif;
			background: #fff;
		}

		header {
			margin-bottom: 14px;
		}

		h1 {
			margin: 0 0 3px;
			font-size: 15px;
			font-weight: 650;
		}

		.subtle {
			color: var(--muted);
			font-size: 11.5px;
		}

		section {
			margin-bottom: 12px;
			padding: 11px 12px;
			border: 1px solid var(--line);
			border-radius: 10px;
		}

		h2 {
			margin: 0 0 9px;
			color: var(--muted);
			font-size: 10px;
			font-weight: 700;
			letter-spacing: .08em;
			text-transform: uppercase;
		}

		dl {
			display: grid;
			grid-template-columns: auto minmax(0, 1fr);
			gap: 6px 12px;
			margin: 0;
		}

		dt {
			color: var(--muted);
			font-size: 11.5px;
			white-space: nowrap;
		}

		dd {
			margin: 0;
			min-width: 0;
			font-size: 12px;
			word-break: break-all;
		}

		dd.empty {
			color: #9ca3af;
		}

		code {
			font: 11.5px/1.5 'Cascadia Code', ui-monospace, monospace;
		}

		.pill {
			display: inline-block;
			padding: 1px 8px;
			border-radius: 999px;
			font-size: 11px;
			font-weight: 600;
			background: #eef1f6;
			color: var(--muted);
		}

		.pill.on {
			background: #fdf3e3;
			color: var(--warn);
		}

		.pill.off {
			background: #e9f7f1;
			color: var(--ok);
		}

		ul.perms {
			display: flex;
			flex-wrap: wrap;
			gap: 5px;
			margin: 0;
			padding: 0;
			list-style: none;
		}

		ul.perms li {
			padding: 2px 8px;
			border: 1px solid var(--line);
			border-radius: 999px;
			font: 11px/1.5 'Cascadia Code', ui-monospace, monospace;
			color: var(--accent);
		}

		ol.log {
			margin: 0;
			padding-left: 18px;
			font-size: 11.5px;
			color: var(--muted);
		}

		ol.log li {
			margin-bottom: 3px;
		}

		ol.log b {
			color: var(--ink);
			font-weight: 600;
		}

		.error {
			color: #dc4545;
			font-size: 11.5px;
		}
	</style>
</head>

<body>
	<header>
		<h1>我的第一个插件</h1>
		<p class="subtle" id="panel-key">面板标识读取中…</p>
	</header>

	<section>
		<h2>已授予的权限</h2>
		<ul class="perms" id="permissions">
			<li>等待 handshake…</li>
		</ul>
	</section>

	<section>
		<h2>当前上下文</h2>
		<dl id="context">
			<dt>状态</dt>
			<dd class="empty">读取中…</dd>
		</dl>
		<p class="error" id="context-error" hidden></p>
	</section>

	<section>
		<h2>会话内容</h2>
		<dl>
			<dt>消息条数</dt>
			<dd id="message-count" class="empty">尚未收到 transcript 事件</dd>
		</dl>
	</section>

	<section>
		<h2>收到的事件</h2>
		<ol class="log" id="log">
			<li>暂无</li>
		</ol>
	</section>

	<script>
		// window.selfclaw 由宿主在文档创建前注入，插件不需要 import，也不需要构建步骤。
		// CSP 允许内联 <script>，但不允许 eval / new Function，也不允许从 CDN 取任何东西——
		// 要用的库必须打进包里。

		const $ = (id) => document.getElementById(id);
		const LOG_LIMIT = 8;
		const events = [];

		function log(type, detail) {
			events.unshift({
				type,
				detail,
				at: new Date().toLocaleTimeString('zh-CN', { hour12: false }),
			});
			events.length = Math.min(events.length, LOG_LIMIT);
			$('log').innerHTML = events
				.map((entry) => `<li><b>${entry.type}</b> · ${entry.at}${entry.detail ? ' · ' + entry.detail : ''}</li>`)
				.join('');
		}

		// ---- 身份与权限 -------------------------------------------------------
		// panelKey 形如 "<pluginId>/<panelId>"，先从 URL 参数拿到，handshake 时由外壳确认。
		// permissions 是宿主认定的集合，不是 manifest 里写了就算——用户没确认的权限不会出现在这里。
		function renderIdentity() {
			$('panel-key').textContent = `panelKey: ${selfclaw.panelKey || '(未知)'}`;
			const permissions = selfclaw.permissions;
			$('permissions').innerHTML = permissions.length
				? permissions.map((permission) => `<li>${permission}</li>`).join('')
				: '<li>等待 handshake…</li>';
		}

		// 这个页面的脚本可能在 handshake 到达之前或之后运行，两条路都要覆盖：
		// 先直接读一次（到得早就已经有值），再订阅（到得晚就等事件）。
		renderIdentity();
		selfclaw.on('handshake', () => {
			renderIdentity();
			log('handshake', '权限已确认');
		});

		// ---- 上下文：先拉一次，再订阅变化 --------------------------------------
		// 推送只在上下文真正变化时发出，空闲会话里可能长时间没有下一次；
		// 拉和推携带的是同一个记录，所以 render 不需要区分来源。
		const FIELDS = [
			['会话 ID', 'conversationId'],
			['代理 ID', 'agentId'],
			['代理名称', 'agentName'],
			['执行模式', 'agentMode'],
			['工作区路径', 'workspaceRootPath'],
			['工作区名称', 'workspaceRootName'],
		];

		function renderContext(context) {
			const rows = FIELDS.map(([label, key]) => {
				const value = context[key];
				return value
					? `<dt>${label}</dt><dd><code>${value}</code></dd>`
					: `<dt>${label}</dt><dd class="empty">（未选择）</dd>`;
			});
			rows.push(
				'<dt>正在运行</dt>'
				+ `<dd><span class="pill ${context.isBusy ? 'on' : 'off'}">`
				+ `${context.isBusy ? '进行中' : '空闲'}</span></dd>`,
			);
			$('context').innerHTML = rows.join('');
			$('context-error').hidden = true;
		}

		selfclaw.getContext()
			.then((context) => {
				renderContext(context);
				log('getContext', '拉取成功');
			})
			.catch((error) => {
				// 权限未授予、面板未打开等情况会走到这里，宿主会给出原因。
				$('context-error').hidden = false;
				$('context-error').textContent = `拉取上下文失败：${error.message}`;
			});

		selfclaw.on('context-changed', (context) => {
			renderContext(context);
			log('context-changed', '上下文已更新');
		});

		// ---- transcript：需要 host.transcript.read ------------------------------
		selfclaw.on('transcript', (payload) => {
			const items = payload.items || [];
			const element = $('message-count');
			element.classList.remove('empty');
			element.textContent = `${items.length} 条`;
			log('transcript', `${items.length} 条消息`);
		});

		// 告诉外壳这个面板已经加载完成。不调用也能工作，但外壳无从知道加载状态。
		selfclaw.ready();
	</script>
</body>

</html>
