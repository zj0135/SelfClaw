<!doctype html>
<html lang="zh-CN" data-theme="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SelfClaw</title>
		<style>
			:root {
				color-scheme: dark;
				--bg: #06080b;
				--bg-depth: #0a0f17;
				--panel: #0b0f14;
				--panel-soft: #0f141a;
				--panel-muted: #10151b;
				--panel-elevated: #131922;
				--border: #171f28;
				--border-strong: rgba(111, 141, 255, 0.24);
				--text: #f4f7fb;
				--muted: #8c95a3;
				--muted-soft: #697381;
				--accent: #6f8dff;
				--accent-2: #63c6ff;
				--accent-soft: rgba(111, 141, 255, 0.14);
				--accent-rgb: 111, 141, 255;
				--success: #1ed760;
				--danger: #ff8593;
				--shadow: 0 18px 36px rgba(0, 0, 0, 0.28);
				--shadow-soft: 0 24px 48px rgba(0, 0, 0, 0.22);
				--radius-xl: 20px;
				--radius-lg: 16px;
				--radius-md: 12px;
				--surface-glow: linear-gradient(180deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01) 28%);
				--focus-ring: 0 0 0 3px rgba(var(--accent-rgb), 0.18);
				--shell-gap: 16px;
				--shell-padding: 18px;
				--font-ui: 'Segoe UI Variable Text', 'Segoe UI', sans-serif;
				--font-display: 'Segoe UI Variable Display', 'Segoe UI', sans-serif;
				--font-code: 'Cascadia Code', Consolas, monospace;
				--scroll-track: rgba(255, 255, 255, 0.03);
				--scroll-thumb: rgba(255, 255, 255, 0.12);
			}

			html[data-theme='light'] {
				color-scheme: light;
				--bg: #edf3fb;
				--bg-depth: #dfe9f7;
				--panel: #ffffff;
				--panel-soft: #f7f9fc;
				--panel-muted: #eef3fa;
				--panel-elevated: #ffffff;
				--border: #d7e1ee;
				--border-strong: rgba(78, 112, 235, 0.2);
				--text: #16202f;
				--muted: #617086;
				--muted-soft: #7f8ca0;
				--accent: #4e70eb;
				--accent-2: #2db1f6;
				--accent-soft: rgba(78, 112, 235, 0.1);
				--accent-rgb: 78, 112, 235;
				--success: #149947;
				--danger: #e14b63;
				--shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
				--shadow-soft: 0 24px 48px rgba(15, 23, 42, 0.1);
				--surface-glow: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.68) 28%);
				--focus-ring: 0 0 0 3px rgba(var(--accent-rgb), 0.16);
				--scroll-track: rgba(15, 23, 42, 0.05);
				--scroll-thumb: rgba(78, 112, 235, 0.28);
			}

			* {
				box-sizing: border-box;
			}

			html,
			body {
				margin: 0;
				height: 100%;
				min-height: 100vh;
				min-height: 100dvh;
				overflow: hidden;
				font-family: var(--font-ui);
				color: var(--text);
				background:
					radial-gradient(circle at top right, rgba(111, 141, 255, 0.08), transparent 24%),
					radial-gradient(circle at 20% 20%, rgba(99, 198, 255, 0.06), transparent 20%), var(--bg);
			}

			body {
				padding: 0;
				overflow: hidden;
			}

			#app {
				width: 100%;
				height: 100vh;
				height: 100dvh;
				min-height: 100vh;
				min-height: 100dvh;
				overflow: hidden;
			}

			::-webkit-scrollbar {
				width: 10px;
				height: 10px;
			}

			::-webkit-scrollbar-track {
				background: var(--scroll-track);
				border-radius: 999px;
			}

			::-webkit-scrollbar-thumb {
				background: var(--scroll-thumb);
				border-radius: 999px;
			}

			button,
			input,
			textarea,
			select {
				font: inherit;
				transition:
					border-color 160ms ease,
					background 160ms ease,
					box-shadow 180ms ease,
					transform 160ms ease,
					filter 160ms ease,
					color 160ms ease;
			}

			button {
				cursor: pointer;
			}

			:where(button, input, textarea, select):focus-visible {
				outline: none;
				box-shadow: var(--focus-ring);
			}

			.app-shell {
				display: grid;
				grid-template-columns: 300px minmax(0, 1fr) 296px;
				width: 100%;
				height: 100%;
				min-height: 100vh;
				min-height: 100dvh;
				align-items: stretch;
				gap: var(--shell-gap);
				padding: var(--shell-padding);
			}

			.panel {
				border: 1px solid var(--border);
				border-radius: 30px;
				background: var(--surface-glow), var(--panel);
				box-shadow:
					var(--shadow-soft),
					inset 0 1px 0 rgba(255, 255, 255, 0.03);
				overflow: hidden;
			}

			.sidebar {
				padding: 18px 16px 16px;
				display: flex;
				flex-direction: column;
				min-height: 0;
				overflow: hidden;
				background:
					radial-gradient(circle at top left, rgba(var(--accent-rgb), 0.14), transparent 32%),
					linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 18%), var(--panel);
			}

			.brand {
				display: flex;
				align-items: center;
				gap: 12px;
			}

			.brand-badge {
				width: 40px;
				height: 40px;
				border-radius: 20px;
				background: linear-gradient(135deg, var(--accent), var(--accent-2));
				display: grid;
				place-items: center;
				color: white;
				font-weight: 700;
				box-shadow:
					0 14px 28px rgba(var(--accent-rgb), 0.24),
					inset 0 1px 0 rgba(255, 255, 255, 0.24);
			}

			.brand-name {
				font-family: var(--font-display);
				font-size: 19px;
				font-weight: 650;
				letter-spacing: 0.01em;
			}

			.status-row {
				display: flex;
				align-items: center;
				gap: 6px;
				color: var(--muted);
				margin-top: 4px;
				font-size: 11px;
			}

			.status-dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: var(--success);
				box-shadow: 0 0 0 4px rgba(30, 215, 96, 0.12);
				flex: 0 0 auto;
			}

			.sidebar-primary {
				margin-top: 14px;
				width: 100%;
				border: 1px solid rgba(var(--accent-rgb), 0.18);
				border-radius: 18px;
				padding: 14px 16px;
				text-align: left;
				background: linear-gradient(135deg, var(--accent), var(--accent-2));
				color: white;
				font-weight: 700;
				box-shadow:
					0 16px 30px rgba(var(--accent-rgb), 0.24),
					inset 0 1px 0 rgba(255, 255, 255, 0.22);
				transition:
					transform 140ms ease,
					box-shadow 180ms ease,
					filter 180ms ease;
			}

			.sidebar-primary:hover {
				transform: translateY(-1px);
				filter: brightness(1.02);
				box-shadow: 0 16px 30px rgba(111, 141, 255, 0.2);
			}

			.search-box {
				margin-top: 14px;
				border: 1px solid var(--border);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent), var(--panel-soft);
				border-radius: 16px;
				padding: 11px 13px;
				color: var(--text);
				width: 100%;
				outline: none;
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
			}

			.search-box::placeholder {
				color: var(--muted-soft);
			}

			.search-box:focus {
				border-color: var(--border-strong);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent), var(--panel-elevated);
				box-shadow:
					var(--focus-ring),
					inset 0 1px 0 rgba(255, 255, 255, 0.03);
			}

			.section-title {
				margin-top: 14px;
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--muted);
			}

			.conversation-list {
				margin-top: 10px;
				min-height: 0;
				flex: 1 1 auto;
				overflow-y: auto;
				overflow-x: hidden;
				display: flex;
				flex-direction: column;
				gap: 8px;
				padding-right: 4px;
			}

			.conversation-row {
				position: relative;
			}

			.conversation-card {
				width: 100%;
				border: 1px solid var(--border);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.025), transparent), var(--panel-muted);
				color: inherit;
				border-radius: 18px;
				padding: 13px 52px 13px 14px;
				text-align: left;
				position: relative;
				transition:
					transform 140ms ease,
					border-color 160ms ease,
					background 160ms ease,
					box-shadow 160ms ease;
			}

			.conversation-card:hover {
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent), var(--panel-elevated);
				transform: translateX(2px);
				box-shadow: 0 14px 28px rgba(0, 0, 0, 0.14);
			}

			.conversation-card.selected {
				border-color: #3c5cb3;
				background: linear-gradient(180deg, rgba(26, 34, 48, 0.98), rgba(16, 23, 34, 0.98));
				box-shadow: inset 0 0 0 1px rgba(111, 141, 255, 0.18);
			}

			.conversation-menu-shell {
				position: absolute;
				top: 8px;
				right: 8px;
				z-index: 4;
			}

			.conversation-menu-btn {
				width: 30px;
				height: 30px;
				border-radius: 10px;
				border: 1px solid rgba(255, 255, 255, 0.06);
				background: rgba(255, 255, 255, 0.02);
				color: var(--muted);
				display: grid;
				place-items: center;
				font-size: 15px;
				line-height: 1;
				padding: 0;
				transition:
					transform 140ms ease,
					background 140ms ease,
					border-color 140ms ease,
					color 140ms ease;
			}

			.conversation-menu-btn:hover {
				transform: translateY(-1px);
				background: var(--panel-elevated);
				border-color: rgba(111, 141, 255, 0.22);
				color: var(--text);
			}

			.conversation-menu {
				position: absolute;
				top: 42px;
				right: 0;
				z-index: 8;
				min-width: 128px;
				padding: 6px;
				border: 1px solid var(--border);
				border-radius: 14px;
				background: var(--panel-elevated);
				box-shadow: var(--shadow);
			}

			.conversation-menu.upward {
				top: auto;
				bottom: 38px;
			}

			.conversation-menu-item {
				width: 100%;
				border: 0;
				border-radius: 10px;
				background: transparent;
				color: var(--text);
				text-align: left;
				padding: 9px 10px;
				font-size: 12px;
				font-weight: 650;
			}

			.conversation-menu-item:hover {
				background: rgba(255, 255, 255, 0.04);
			}

			.conversation-menu-item.danger {
				color: var(--danger);
			}

			.conversation-card.selected::before {
				content: '';
				position: absolute;
				left: -1px;
				top: 10px;
				bottom: 10px;
				width: 3px;
				border-radius: 999px;
				background: linear-gradient(180deg, var(--accent), var(--accent-2));
			}

			.conversation-title {
				font-size: 13px;
				font-weight: 650;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
			}

			.conversation-time {
				margin-top: 4px;
				color: var(--muted);
				font-size: 11px;
			}

			.sidebar-footer {
				margin-top: 14px;
				border: 1px solid var(--border);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent), var(--panel-soft);
				border-radius: 18px;
				padding: 12px;
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 10px;
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
			}

			.sidebar-footer-copy {
				min-width: 0;
			}

			.sidebar-footer-title {
				font-weight: 650;
			}

			.sidebar-footer-subtitle {
				margin-top: 4px;
				color: var(--muted);
				font-size: 11px;
			}

			.avatar {
				width: 32px;
				height: 32px;
				border-radius: 12px;
				background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.2), rgba(99, 198, 255, 0.16));
				display: grid;
				place-items: center;
				font-weight: 700;
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
			}

			.main-column {
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				display: grid;
				grid-template-rows: auto minmax(0, 1fr) auto;
				gap: 14px;
			}

			.topbar {
				display: flex;
				align-items: center;
				justify-content: space-between;
				gap: 16px;
				padding: 16px 20px;
				border-bottom: 1px solid rgba(255, 255, 255, 0.05);
				background:
					radial-gradient(circle at top center, rgba(var(--accent-rgb), 0.1), transparent 34%),
					linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 70%), var(--panel);
				backdrop-filter: blur(16px);
			}

			.chip-row,
			.icon-row {
				display: flex;
				align-items: center;
				gap: 10px;
			}

			.topbar-right {
				display: flex;
				align-items: center;
				justify-content: flex-end;
				gap: 10px;
				min-width: 0;
				flex-wrap: wrap;
			}

			.context-pill {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				min-width: 0;
				max-width: 240px;
				padding: 7px 12px;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent), var(--panel-muted);
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
			}

			.context-label {
				flex: 0 0 auto;
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--muted);
			}

			.context-value {
				min-width: 0;
				overflow: hidden;
				text-overflow: ellipsis;
				white-space: nowrap;
				font-size: 12px;
				font-weight: 650;
				color: var(--text);
			}

			.mode-chip {
				border: 1px solid var(--border);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent), var(--panel-muted);
				color: var(--muted);
				border-radius: 999px;
				padding: 8px 13px;
				font-weight: 650;
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.025);
				transition:
					transform 140ms ease,
					border-color 140ms ease,
					background 140ms ease,
					color 140ms ease,
					box-shadow 140ms ease;
			}

			.mode-chip:hover {
				transform: translateY(-1px);
				color: var(--text);
				border-color: rgba(111, 141, 255, 0.22);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent), var(--panel-elevated);
			}

			.mode-chip.active {
				border-color: rgba(111, 141, 255, 0.42);
				color: var(--text);
				background: linear-gradient(180deg, rgba(111, 141, 255, 0.18), rgba(99, 198, 255, 0.08)), #171d29;
				box-shadow:
					inset 0 0 0 1px rgba(111, 141, 255, 0.18),
					0 10px 22px rgba(79, 111, 224, 0.18);
			}

			.icon-btn {
				min-width: 38px;
				height: 38px;
				border-radius: 12px;
				border: 1px solid var(--border);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent), var(--panel-muted);
				color: var(--text);
				display: grid;
				place-items: center;
				padding: 0 12px;
				font-size: 12px;
				font-weight: 700;
				transition:
					transform 140ms ease,
					background 140ms ease,
					border-color 140ms ease;
			}

			.icon-btn:hover {
				transform: translateY(-1px);
				background: var(--panel-elevated);
				border-color: rgba(111, 141, 255, 0.22);
			}

			.workbench-label {
				color: var(--muted);
				font-size: 12px;
			}

			.transcript-panel {
				min-height: 0;
				overflow: hidden;
				display: flex;
				flex-direction: column;
				background: radial-gradient(circle at top, rgba(var(--accent-rgb), 0.06), transparent 26%), var(--surface-glow), var(--panel);
			}

			.transcript-scroll {
				min-height: 0;
				flex: 1 1 auto;
				overflow-y: auto;
				overflow-x: hidden;
				overscroll-behavior: contain;
				padding: 20px 22px 24px;
				display: flex;
				flex-direction: column;
				gap: 16px;
				scroll-padding-bottom: 28px;
			}

			.message-row {
				width: 100%;
				display: flex;
				align-items: flex-start;
				gap: 10px;
			}

			.message-row.user {
				justify-content: flex-end;
			}

			.message-main {
				min-width: 0;
				flex: 0 1 min(100%, 920px);
				max-width: min(100%, 920px);
			}

			.message-row.user .message-main {
				max-width: min(82%, 760px);
			}

			.message-avatar {
				width: 36px;
				height: 36px;
				flex: 0 0 36px;
				display: grid;
				place-items: center;
				border-radius: 16px;
				border: 1px solid var(--border);
				background: linear-gradient(135deg, rgba(111, 141, 255, 0.18), rgba(99, 198, 255, 0.14));
				color: var(--text);
				font-size: 11px;
				font-weight: 800;
				letter-spacing: 0.03em;
				box-shadow:
					0 10px 20px rgba(0, 0, 0, 0.16),
					inset 0 1px 0 rgba(255, 255, 255, 0.04);
				position: sticky;
				top: 12px;
			}

			.message-row.user .message-avatar {
				order: 2;
				background: linear-gradient(135deg, var(--accent), var(--accent-2));
				border-color: transparent;
				color: white;
			}

			.message-row.tool {
				gap: 10px;
			}

			.message-row.tool .message-avatar.tool-spacer {
				visibility: hidden;
				box-shadow: none;
			}

			.item {
				width: 100%;
				min-height: 72px;
				display: block;
				flex: 0 0 auto;
				position: relative;
				overflow: hidden;
				border-radius: 26px;
				border: 1px solid var(--border);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.026), transparent 24%), var(--panel-soft);
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.03),
					0 10px 22px rgba(0, 0, 0, 0.08);
				transition:
					transform 160ms ease,
					border-color 160ms ease,
					box-shadow 160ms ease;
			}

			.item:hover {
				transform: translateY(-2px);
				border-color: rgba(111, 141, 255, 0.18);
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.03),
					0 20px 40px rgba(0, 0, 0, 0.18);
			}

			.item.message.assistant,
			.item.message.system {
				background:
					linear-gradient(180deg, rgba(255, 255, 255, 0.028), transparent 26%), linear-gradient(180deg, var(--panel-soft), var(--panel-muted));
			}

			.item.message.user {
				background: linear-gradient(135deg, rgba(23, 32, 48, 0.98), rgba(13, 20, 31, 0.98));
				border-color: #334968;
			}

			.item::after {
				content: '';
				position: absolute;
				inset: 0;
				pointer-events: none;
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 30%);
			}

			.header {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 10px;
				padding: 14px;
				font-size: 11px;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--muted);
			}

			.header.no-title {
				justify-content: flex-start;
				padding-bottom: 8px;
			}

			.header.no-title span {
				padding: 0;
				border: 0;
				background: transparent;
				border-radius: 0;
				font-weight: 600;
			}

			.header span:first-child {
				padding: 0 0 0 5px;
				font-weight: 700;
			}

			.message-heading {
				display: inline-flex;
				align-items: center;
				gap: 8px;
			}

			.message-subtitle {
				padding: 0;
				font-weight: 500;
				letter-spacing: 0.04em;
				text-transform: none;
				opacity: 0.82;
			}

			.message-row.user .header {
				color: rgba(223, 231, 243, 0.72);
			}

			.message-row.user .header span:first-child {
				padding: 0px 0px;
			}

			.body {
				display: block;
				min-height: 36px;
				padding: 12px 16px 16px;
				font-size: 14px;
				line-height: 1.75;
			}

			.inline-tool {
				display: inline-flex;
				align-items: center;
				gap: 10px;
				margin: 2px 0;
				padding: 10px 14px;
				border-radius: 14px;
				border: 1px solid rgba(60, 204, 122, 0.14);
				background: rgba(10, 20, 14, 0.62);
				color: #d6dfec;

				place-items: center;

				overflow: hidden;
				box-shadow:
					0 16px 30px rgba(79, 111, 224, 0.28),
					inset 0 1px 0 rgba(255, 255, 255, 0.2);

					transform 160ms ease,
					box-shadow 180ms ease,
					filter 160ms ease,
					background 180ms ease,
					border-color 180ms ease;

					box-shadow 160ms ease;
			}

			.activity-card:hover {
				transform: translateY(-2px);
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent), var(--panel-elevated);
				box-shadow:
					inset 0 1px 0 rgba(255, 255, 255, 0.03),
					0 16px 28px rgba(0, 0, 0, 0.14);
			}

			@keyframes send-spin {
				to {
					transform: rotate(360deg);
				}
			}

			.activity-card.running {
				border-color: rgba(30, 215, 96, 0.35);
			}

			.activity-card.failed {
				border-color: rgba(255, 133, 147, 0.4);
			}

			.activity-card.awaitingapproval {
				border-color: rgba(255, 193, 7, 0.45);
				background: linear-gradient(180deg, rgba(255, 193, 7, 0.08), rgba(255, 193, 7, 0.03)), var(--panel-muted);
			}

			.activity-card.cancelled {
				border-color: rgba(140, 149, 163, 0.35);
			}

			.activity-summary {
				padding: 11px 12px;
				cursor: pointer;
				user-select: none;
				position: relative;
			}

			.activity-summary::before {
				content: '';
				position: absolute;
				left: 14px;
				top: 16px;
				width: 9px;
				height: 9px;
				border-radius: 50%;
				background: linear-gradient(135deg, var(--accent), var(--accent-2));
				box-shadow: 0 0 0 4px rgba(111, 141, 255, 0.1);
			}

			.activity-top {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				gap: 10px;
				padding-left: 18px;
			}

			.activity-title {
				margin-top: 0;
				font-weight: 650;
				line-height: 1.35;
			}

			.activity-toggle {
				flex: 0 0 auto;
				pointer-events: none;
			}

			.activity-meta {
				margin-top: 10px;
				display: flex;
				flex-direction: column;
				gap: 4px;
				padding-left: 18px;
			}

			.activity-meta-item {
				display: grid;
				grid-template-columns: 48px minmax(0, 1fr);
				align-items: start;
				gap: 8px;
				border: 1px solid var(--border);
				background: var(--panel-soft);
				border-radius: 10px;
				padding: 8px 10px;
				min-width: 0;
			}

			.activity-meta-label {
				color: var(--muted);
				font-size: 14px;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				line-height: 1.4;
			}

			.activity-meta-value {
				font-size: 14px;
				font-weight: 600;
				line-height: 1.4;
				white-space: normal;
				overflow: visible;
				text-overflow: clip;
				word-break: break-word;
			}

			.activity-text {
				margin-top: 10px;
				color: var(--muted);
				font-size: 11px;
				line-height: 1.6;
				padding-left: 18px;
			}

			.activity-details {
				display: none;
				padding: 0 14px 14px;
				overflow: visible;
			}

			.activity-card.open .activity-details {
				display: block;
			}

			.detail-block {
				margin-top: 10px;
			}

			.detail-label {
				color: var(--muted);
				font-size: 14px;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
			}

			.detail-value {
				margin-top: 4px;
				border: 1px solid var(--border);
				border-radius: 10px;
				background: var(--panel-soft);
				padding: 10px;
				white-space: pre-wrap;
				word-break: break-word;
				font-size: 14px;
				line-height: 1.6;
			}

			.detail-value.code {
				font-family: var(--font-code);
				font-size: 14px;
			}

			.muted-placeholder {
				padding: 16px 14px;
				border: 1px dashed var(--border);
				border-radius: 18px;
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.018), transparent), var(--panel-soft);
				color: var(--muted);
				font-size: 12px;
				line-height: 1.7;
			}

			.activity-actions {
				margin-top: 12px;
				display: flex;
				gap: 8px;
				flex-wrap: wrap;
			}

			.activity-action-btn {
				border-radius: 12px;
				padding: 9px 12px;
				font-size: 12px;
				font-weight: 700;
				border: 1px solid var(--border);
				transition:
					transform 140ms ease,
					background 140ms ease,
					border-color 140ms ease,
					filter 140ms ease;
			}

			.activity-action-btn:hover {
				transform: translateY(-1px);
			}

			.activity-action-btn.primary {
				border-color: rgba(111, 141, 255, 0.28);
				background: linear-gradient(135deg, var(--accent), var(--accent-2));
				color: white;
			}

			.activity-action-btn.secondary {
				background: var(--panel-soft);
				color: var(--text);
			}

			.settings-overlay {
				position: fixed;
				inset: 0;
				background: rgba(4, 6, 9, 0.62);
				display: none;
				align-items: flex-end;
				justify-content: flex-start;
				padding: 24px;
				z-index: 20;
				backdrop-filter: blur(8px);
			}

			.settings-overlay.open {
				display: flex;
			}

			.settings-panel {
				width: min(468px, 100%);
				max-height: calc(100vh - 48px);
				overflow: auto;
				border: 1px solid var(--border);
				border-radius: 28px;
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.03), transparent 18%), var(--panel);
				box-shadow: var(--shadow);
				padding: 20px;
			}

			.settings-header {
				display: flex;
				justify-content: space-between;
				gap: 10px;
				align-items: flex-start;
			}

			.settings-title {
				font-family: var(--font-display);
				font-size: 22px;
				font-weight: 650;
			}

			.close-btn {
				width: 40px;
				height: 40px;
				border-radius: 14px;
				border: 1px solid var(--border);
				background: var(--panel-muted);
				color: var(--text);
				display: grid;
				place-items: center;
				transition:
					transform 140ms ease,
					background 140ms ease,
					border-color 140ms ease;
			}

			.close-btn:hover {
				transform: translateY(-1px);
				background: var(--panel-elevated);
				border-color: rgba(111, 141, 255, 0.22);
			}

			.settings-feedback {
				margin-top: 14px;
				padding: 10px 12px;
				border-radius: 14px;
				border: 1px solid var(--border);
				font-size: 11px;
				line-height: 1.55;
			}

			.settings-feedback.success {
				border-color: rgba(30, 215, 96, 0.28);
				background: rgba(30, 215, 96, 0.08);
				color: #b8f5cb;
			}

			.settings-feedback.error {
				border-color: rgba(255, 133, 147, 0.3);
				background: rgba(255, 133, 147, 0.1);
				color: #ffc5cd;
			}

			.settings-section {
				margin-top: 14px;
				padding: 18px;
				border: 1px solid var(--border);
				border-radius: 20px;
				background: var(--panel-soft);
			}

			.settings-section-header {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				gap: 10px;
			}

			.settings-section-copy {
				min-width: 0;
			}

			.settings-section-title {
				font-family: var(--font-display);
				font-size: 18px;
				font-weight: 650;
			}

			.settings-badge {
				padding: 4px 8px;
				border-radius: 999px;
				border: 1px solid var(--border);
				background: var(--panel-muted);
				color: var(--muted);
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.04em;
				text-transform: uppercase;
				white-space: nowrap;
			}

			.field-group {
				margin-top: 14px;
			}

			.field-label {
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.06em;
				color: var(--muted);
				text-transform: uppercase;
				margin-bottom: 8px;
			}

			.field-inline {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 10px;
			}

			.settings-select-row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto auto;
				gap: 10px;
				align-items: center;
			}

			.settings-inline-actions {
				display: inline-flex;
				align-items: center;
				gap: 10px;
			}

			.selected-summary-grid {
				display: grid;
				grid-template-columns: repeat(2, minmax(0, 1fr));
				gap: 10px;
				margin-top: 14px;
			}

			.selected-summary-card {
				min-width: 0;
				border: 1px solid var(--border);
				border-radius: 14px;
				background: var(--panel-muted);
				padding: 10px 12px;
			}

			.selected-summary-label {
				color: var(--muted);
				font-size: 11px;
				font-weight: 700;
				letter-spacing: 0.08em;
				text-transform: uppercase;
			}

			.selected-summary-value {
				margin-top: 8px;
				line-height: 1.55;
				word-break: break-word;
			}

			.field-select,
			.field-readonly,
			.field-input {
				width: 100%;
				border: 1px solid var(--border);
				border-radius: 14px;
				background: var(--panel-muted);
				color: var(--text);
				padding: 10px 12px;
				outline: none;
				transition:
					border-color 140ms ease,
					box-shadow 140ms ease,
					background 140ms ease;
			}

			.field-input::placeholder {
				color: var(--muted-soft);
			}

			.field-select:focus,
			.field-input:focus {
				border-color: rgba(111, 141, 255, 0.48);
				box-shadow: 0 0 0 3px rgba(111, 141, 255, 0.14);
				background: var(--panel-elevated);
			}

			.field-help {
				margin-top: 10px;
				color: var(--muted);
				font-size: 11px;
				line-height: 1.6;
			}

			.field-readonly {
				display: flex;
				align-items: center;
				min-height: 44px;
				word-break: break-word;
			}

			.field-picker-row {
				display: grid;
				grid-template-columns: minmax(0, 1fr) auto;
				gap: 10px;
				align-items: center;
			}

			.compact-btn {
				min-width: 72px;
				padding: 11px 14px;
			}

			.icon-add-btn {
				width: 40px;
				height: 40px;
				border-radius: 999px;
				border: 1px solid rgba(111, 141, 255, 0.26);
				background: linear-gradient(135deg, rgba(111, 141, 255, 0.18), rgba(99, 198, 255, 0.18));
				color: var(--text);
				display: grid;
				place-items: center;
				font-size: 24px;
				line-height: 1;
				padding: 0;
				box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
				transition:
					transform 140ms ease,
					filter 180ms ease,
					border-color 140ms ease;
			}

			.icon-add-btn:hover {
				transform: translateY(-1px);
				filter: brightness(1.04);
				border-color: rgba(111, 141, 255, 0.42);
			}

			.settings-footer {
				display: flex;
				gap: 10px;
				margin-top: 14px;
			}

			.settings-footer > button {
				flex: 1 1 auto;
			}

			.ghost-btn,
			.primary-btn {
				border-radius: 14px;
				padding: 10px 12px;
				font-weight: 650;
				transition:
					transform 140ms ease,
					box-shadow 180ms ease,
					filter 180ms ease,
					background 140ms ease,
					border-color 140ms ease;
			}

			.ghost-btn {
				border: 1px solid var(--border);
				background: var(--panel-muted);
				color: var(--text);
			}

			.ghost-btn:hover {
				transform: translateY(-1px);
				background: var(--panel-elevated);
				border-color: rgba(111, 141, 255, 0.22);
			}

			.primary-btn {
				border: 0;
				color: white;
				background: linear-gradient(135deg, var(--accent), var(--accent-2));
				box-shadow: 0 12px 24px rgba(111, 141, 255, 0.16);
			}

			.primary-btn:hover {
				transform: translateY(-1px);
				filter: brightness(1.02);
				box-shadow: 0 16px 30px rgba(111, 141, 255, 0.2);
			}

			.settings-panel button[disabled] {
				opacity: 0.46;
				cursor: not-allowed;
				transform: none;
				box-shadow: none;
				filter: none;
			}

			.editor-overlay {
				position: fixed;
				inset: 0;
				display: none;
				align-items: center;
				justify-content: center;
				padding: 24px;
				background: rgba(4, 6, 9, 0.52);
				backdrop-filter: blur(10px);
				z-index: 30;
			}

			.editor-overlay.open {
				display: flex;
			}

			.editor-panel {
				width: min(560px, 100%);
				max-height: calc(100vh - 48px);
				overflow: auto;
				border: 1px solid var(--border);
				border-radius: 28px;
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), transparent 16%), var(--panel);
				box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
				padding: 22px;
			}

			.editor-header {
				display: flex;
				justify-content: space-between;
				align-items: flex-start;
				gap: 10px;
			}

			.editor-title {
				font-family: var(--font-display);
				font-size: 24px;
				font-weight: 650;
			}

			.editor-body {
				display: grid;
				gap: 10px;
				margin-top: 14px;
			}

			.editor-footer {
				display: flex;
				justify-content: flex-end;
				gap: 10px;
				margin-top: 14px;
			}

			@media (max-width: 900px) {
				.settings-overlay {
					align-items: stretch;
					justify-content: stretch;
					padding: 10px;
				}

				.settings-panel {
					width: 100%;
					max-height: none;
					border-radius: 22px;
				}

				.settings-select-row,
				.field-inline,
				.selected-summary-grid {
					grid-template-columns: 1fr;
				}

				.composer-toolbar {
					align-items: stretch;
				}

				.permission-control {
					width: 100%;
				}

				.team-controls,
				.team-control {
					width: 100%;
				}

				.permission-select {
					width: 100%;
				}

				.editor-overlay {
					padding: 10px;
				}

				.editor-panel {
					width: 100%;
					max-height: none;
					border-radius: 22px;
				}
			}

			html[data-theme='light'] .conversation-card.selected {
				background: linear-gradient(180deg, #dfe8ff, #d3e0fb);
				border-color: #8aa1f7;
				color: #16202f;
				box-shadow: inset 0 0 0 1px rgba(78, 112, 235, 0.14);
			}

			html[data-theme='light'] .conversation-card.selected .conversation-time {
				color: #55657e;
			}

			html[data-theme='light'] .mode-chip.active {
				background: #dfe7ff;
				border-color: #8aa1f7;
				color: #1f2f51;
				box-shadow: inset 0 0 0 1px rgba(78, 112, 235, 0.12);
			}

			html[data-theme='light'] .item.message.user {
				background: linear-gradient(135deg, #edf3ff, #e3edff);
				border-color: #b8caf5;
			}

			html[data-theme='light'] .message-row.user .header {
				color: #5f6f87;
			}

			html[data-theme='light'] .message-row.user .header span:first-child {
				border-color: #b7c8f7;
				color: #27407a;
			}

			html[data-theme='light'] .inline-tool {
				background: #f3f7fb;
				border-color: #d8e3ef;
				color: #22344c;
			}

			html[data-theme='light'] .inline-tool.running {
				background: #eefaf2;
				border-color: #b8e7c8;
				color: #1f4f33;
			}

			html[data-theme='light'] .inline-tool.completed {
				background: #f4f7fb;
				border-color: #d6e0eb;
				color: #41566f;
			}

			html[data-theme='light'] .inline-tool.awaitingapproval {
				background: #fff8e9;
				border-color: #f1d79a;
				color: #7a5915;
			}

			html[data-theme='light'] .inline-tool.failed,
			html[data-theme='light'] .inline-tool.cancelled {
				background: #fff1f1;
				border-color: #efc4c4;
				color: #8a3535;
			}

			html[data-theme='light'] .activity-badge,
			html[data-theme='light'] .steps-section-count,
			html[data-theme='light'] .steps-count,
			html[data-theme='light'] .activity-toggle {
				background: #eef3fa;
				color: #1f2f51;
				border-color: #ced8e9;
			}

			html[data-theme='light'] .team-member-card,
			html[data-theme='light'] .activity-meta-item {
				background: #f7f9fc;
				border-color: #d7e1ee;
			}

			html[data-theme='light'] .steps-section-toggle {
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(247, 249, 252, 0.98));
				border-color: #d7e1ee;
			}

			html[data-theme='light'] .team-member-note {
				background: #f7f9fc;
				border-color: #d7e1ee;
			}

			html[data-theme='light'] .thinking-block {
				background: rgba(78, 112, 235, 0.04);
				border-color: rgba(78, 112, 235, 0.16);
			}

			html[data-theme='light'] .thinking-block.pending {
				border-color: rgba(78, 112, 235, 0.22);
			}

			html[data-theme='light'] .thinking-summary:not(.passive):hover {
				background: rgba(78, 112, 235, 0.05);
			}

			html[data-theme='light'] .thinking-markdown {
				color: #5b6c82;
				border-left-color: rgba(78, 112, 235, 0.24);
			}

			html[data-theme='light'] table,
			html[data-theme='light'] th,
			html[data-theme='light'] td {
				color: #ffffff;
			}

			html[data-theme='light'] .avatar {
				background: #dde6f4;
				color: #36507a;
			}

			html[data-theme='light'] .muted-placeholder,
			html[data-theme='light'] .empty {
				background: radial-gradient(circle at top, rgba(var(--accent-rgb), 0.08), transparent 34%), rgba(255, 255, 255, 0.72);
			}

			html[data-theme='light'] .context-pill {
				background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(247, 249, 252, 0.98));
				border-color: #d7e1ee;
			}

			@media (max-width: 1180px) {
				body {
					overflow: hidden;
				}

				#app {
					width: 100%;
					height: 100vh;
					height: 100dvh;
					min-height: 100vh;
					min-height: 100dvh;
					overflow: hidden;
				}

				.app-shell {
					grid-template-columns: 1fr;
					width: 100%;
					height: 100%;
					min-height: 100vh;
					min-height: 100dvh;
					gap: 12px;
					padding: 12px;
				}

				.sidebar,
				.main-column,
				.steps-panel {
					min-height: 0;
				}

				.transcript-panel {
					min-height: 360px;
				}

				.topbar,
				.composer-panel,
				.sidebar,
				.steps-panel {
					padding-left: 16px;
					padding-right: 16px;
				}
			}

			html[data-theme='light'] .ghost-link:hover {
				background: rgba(78, 112, 235, 0.08);
			}

			html[data-theme='light'] .icon-btn:hover,
			html[data-theme='light'] .conversation-card:hover,
			html[data-theme='light'] .item:hover,
			html[data-theme='light'] .activity-card:hover {
				box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08);
			}

			html[data-theme='light'] .activity-summary::before {
				box-shadow: 0 0 0 4px rgba(78, 112, 235, 0.08);
			}

			@media (prefers-reduced-motion: reduce) {
				*,
				*::before,
				*::after {
					animation: none !important;
					transition: none !important;
					scroll-behavior: auto !important;
				}
			}
		</style>
	</head>

	<body>
		<div id="app"></div>
		<div id="settings-overlay" class="settings-overlay"></div>
		<div id="editor-overlay" class="editor-overlay"></div>
		<script src="transcript.js" charset="utf-8"></script>
	</body>
</html>
